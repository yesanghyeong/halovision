name: halovision_app
description: "HaloVision V3"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/halovision_app_icon.png"

  adaptive_icon_background: "#071A3D"
  adaptive_icon_foreground: "assets/images/halovision_app_icon.png"

  min_sdk_android: 21